name: Inventory Local BO2 Data

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Local PS3_GAME folder on the Windows runner
        required: true
        default: 'C:\\BO2\\PS3_GAME'

  push:
    branches: [main]

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify source folder
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "C:\\BO2\\PS3_GAME")) {
            throw "BO2 source folder not found: C:\\BO2\\PS3_GAME"
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory local BO2 data
        shell: powershell
        run: |
          python tools/inventory_bo2.py --source "C:\\BO2\\PS3_GAME" --output reports
      - name: Upload inventory reports
        uses: actions/upload-artifact@v4
        with:
          name: bo2-local-inventory
          path: reports/
          retention-days: 7
